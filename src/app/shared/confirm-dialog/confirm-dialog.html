<!-- Escape already closes the dialog via appFocusTrap's document keydown
     listener, so the click-only backdrop dismissal here has a keyboard
     equivalent — it just isn't on this same element. -->
<div
  class="confirm-modal-backdrop"
  appFocusTrap
  [appFocusTrapDisabled]="busy()"
  (appFocusTrapDismissed)="onCancel()"
>
  <div
    class="confirm-modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="titleId"
    [attr.aria-describedby]="messageId"
  >
    <h2 [id]="titleId" class="confirm-modal-title">{{ title() }}</h2>
    <p [id]="messageId" class="confirm-modal-message">{{ message() }}</p>

    @if (errorMessage()) {
      <p class="confirm-modal-alert" role="alert">{{ errorMessage() }}</p>
    }

    <div class="confirm-modal-actions">
      <button type="button" class="btn btn-primary" [disabled]="busy()" (click)="onConfirm()">
        {{ confirmText() }}
      </button>
      <button
        #cancelButton
        type="button"
        class="btn btn-secondary"
        [disabled]="busy()"
        (click)="onCancel()"
      >
        {{ cancelText() }}
      </button>
    </div>
  </div>
</div>
